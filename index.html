<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ежедневник руководителя</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.bitrix24.ru; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3d6fd9">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
/* всегда светлая тема: мягкий фон, без тёмного режима */
:root{color-scheme:light;--bg:#f3f5fa;--field:#f7f8fc;--card:rgba(255,255,255,.92);--text:#1f2a3d;--muted:#667085;--line:#e2e7f0;--accent:#3d6fd9;--accent-soft:#e7eefc;--ok:#2f9e6a;--bad:#d9483b;--bad-soft:#fdeceb}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);min-height:100vh;background:#eef3fb linear-gradient(160deg,#e9f1fc 0%,#f4f1fa 45%,#fbf3ea 100%) fixed}
header{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 0}
.top h1{font-size:18px;margin:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding:20px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(40,60,110,.06);padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.grid>div{min-width:0}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
input,select,textarea{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:120px;resize:vertical}
.grow{flex:1;min-width:150px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.4s infinite}
.btn.sm{padding:3px 9px;font-size:13px}
@keyframes pulse{50%{opacity:.75}}
.muted{color:var(--muted)}
.small{font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:500}
td input[type=text]{width:100%}
.scroll{overflow-x:auto}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{flex:1;min-width:0}
.task input[type=checkbox]{margin-top:4px;width:17px;height:17px}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin:2px 4px 0 0}
.tag.over{background:var(--bad-soft);color:var(--bad)}
.tag.grey{background:var(--bg);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px;margin-top:8px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.day .cols{flex:1;width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.day .cols div{width:40%;max-width:22px;border-radius:4px 4px 0 0;min-height:2px}
.c1{background:var(--accent)}.c2{background:var(--ok)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:14px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.interim{color:var(--muted);font-style:italic;min-height:1.4em;margin:4px 0 8px}
.stars button{background:none;border:0;font-size:22px;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:#f5b301}
.group h3{font-size:14px;margin:14px 0 4px;color:var(--muted)}
.hint{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
a{color:var(--accent)}
.pbar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;min-width:60px}
.pbar div{height:100%;background:var(--ok)}
/* экран ПИН-кода */
#lock{position:fixed;inset:0;z-index:50;display:flex;overflow:auto;padding:16px;background:#eef3fb linear-gradient(160deg,#e9f1fc 0%,#f4f1fa 45%,#fbf3ea 100%)}
#lock .box{margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;width:min(340px,100%);box-shadow:0 8px 30px rgba(40,60,110,.12)}
.dots{display:flex;gap:16px;justify-content:center;margin:18px 0 6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.dots i.f{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.pad button{font:inherit;font-size:24px;height:62px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--text);cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--accent-soft)}
.pad button.small{font-size:14px;color:var(--muted);background:none;border-color:transparent}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* планшет и сенсорный экран */
@media (pointer:coarse){
  body{font-size:16px}
  .btn{padding:11px 18px}.btn.sm{padding:7px 12px}
  input,select{min-height:44px}
  nav button{padding:11px 14px}
  .task input[type=checkbox],td input[type=checkbox]{width:26px;height:26px}
  .stars button{font-size:30px;padding:0 4px}
  #recBtn{padding:14px 24px;font-size:17px}
}
</style>
</head>
<body>
<header><div class="wrap top">
  <h1>📓 Ежедневник</h1>
  <nav>
    <button data-v="day" onclick="setView('day')">День</button>
    <button data-v="meeting" onclick="setView('meeting')">Совещание</button>
    <button data-v="tasks" onclick="setView('tasks')">Поручения</button>
    <button data-v="stats" onclick="setView('stats')">Аналитика</button>
    <button data-v="people" onclick="setView('people')">Сотрудники и данные</button>
  </nav>
</div></header>
<main class="wrap" id="main"></main>

<script>
const KEY='diary.v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const monday=s=>addDays(s,-((parseYmd(s).getDay()+6)%7));
const ruDate=s=>s?parseYmd(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'';
const dmy=s=>s?s.split('-').reverse().join('.'):'—';
const longDate=s=>parseYmd(s).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const STATUS={new:'Новая',progress:'В работе',done:'Выполнена'};

// ---------- хранение ----------
const EMPTY=()=>({employees:[],days:{},tasks:[],meetings:[],settings:{}});
// при включённом ПИН данные зашифрованы и читаются только после ввода ПИН
let S=(()=>{try{return localStorage.getItem('diary.pin')}catch(e){return null}})()?EMPTY():load();
function load(){try{return Object.assign(EMPTY(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return EMPTY()}}
// Каждой записи ставится время последнего изменения (upd), удалённым — «надгробие» в S.deleted.
// По ним данные с двух устройств объединяются без потерь: побеждает более свежая версия.
let snapMap=null;
function stamp(){
  const now=Date.now(), cur=new Map();
  const put=(k,o)=>{const{upd,...rest}=o;cur.set(k,[o,JSON.stringify(rest)])};
  S.employees.forEach(e=>put('e:'+e.id,e));S.tasks.forEach(t=>put('t:'+t.id,t));S.meetings.forEach(m=>put('m:'+m.id,m));
  Object.entries(S.days).forEach(([d,v])=>put('d:'+d,v));
  S.deleted=S.deleted||{};
  if(snapMap){
    for(const[k,[o,j]]of cur)if(snapMap.get(k)!==j)o.upd=now;
    for(const k of snapMap.keys())if(!cur.has(k)&&!k.startsWith('d:'))S.deleted[k.slice(2)]=now;
  }else for(const[,[o]]of cur)if(!o.upd)o.upd=now;
  for(const[id,t]of Object.entries(S.deleted))if(now-t>180*864e5)delete S.deleted[id];
  snapMap=new Map([...cur].map(([k,[,j]])=>[k,j]));
}
function mergeIn(d){
  const n={emp:0,task:0,meet:0,day:0}, my=S.deleted=S.deleted||{};
  Object.entries(d.deleted||{}).forEach(([id,t])=>{if(!my[id]||my[id]<t)my[id]=t});
  const dead=o=>my[o.id]&&my[o.id]>=(o.upd||0), newer=(a,b)=>(a.upd||0)>(b.upd||0);
  const nm=x=>String(x||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();
  const map={};
  for(const e of d.employees||[]){
    const l=S.employees.find(x=>x.id===e.id)||S.employees.find(x=>nm(x.name)===nm(e.name));
    if(l){map[e.id]=l.id;if(newer(e,l)){Object.assign(l,e,{id:l.id});n.emp++}}
    else if(!dead(e)){S.employees.push(Object.assign({},e));map[e.id]=e.id;n.emp++}
  }
  const fix=t=>Object.assign({},t,{assignee:t.assignee?(map[t.assignee]||t.assignee):''});
  for(const t of d.tasks||[]){const l=S.tasks.find(x=>x.id===t.id);
    if(l){if(newer(t,l)){Object.assign(l,fix(t));n.task++}}else if(!dead(t)){S.tasks.push(fix(t));n.task++}}
  for(const m of d.meetings||[]){const l=S.meetings.find(x=>x.id===m.id);
    if(l){if(newer(m,l)){Object.assign(l,m);n.meet++}}else if(!dead(m)){S.meetings.push(Object.assign({},m));n.meet++}}
  for(const[k,v]of Object.entries(d.days||{}))if(!S.days[k]||newer(v,S.days[k])){S.days[k]=v;n.day++}
  S.employees=S.employees.filter(e=>!dead(e));S.tasks=S.tasks.filter(t=>!dead(t));S.meetings=S.meetings.filter(m=>!dead(m));
  ['b24','myB24'].forEach(k=>{if(!S.settings[k]&&d.settings?.[k])S.settings[k]=d.settings[k]});
  snapMap=null;stamp(); // принятые версии сохраняют своё время изменения
  return n;
}
let saving=Promise.resolve();
function save(){
  stamp();
  const snap=JSON.stringify(S);
  if(pinRec()){
    // никогда не пишем открытым текстом, если ПИН включён
    const k=cryptoKey;if(!k)return;
    saving=saving.then(()=>encWith(k,snap)).then(e=>localStorage.setItem(KEY,e)).catch(e=>alert('Не удалось сохранить данные: '+e.message));
    return;
  }
  try{localStorage.setItem(KEY,snap)}catch(e){alert('Не удалось сохранить данные: '+e.message)}
}

let view='day', curDate=today(), weekStart=monday(today());
let fA='all', fS='open';
let M=newDraft(), cands=[];
function newDraft(){return {id:uid(),date:today(),title:'',transcript:''}}

const emp=id=>S.employees.find(e=>e.id===id);
const empName=id=>id?(emp(id)?.name||'—'):'Я';
const empOpts=sel=>`<option value="">Я</option>`+S.employees.map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.name)}${e.position?' — '+esc(e.position):''}</option>`).join('');
const isOver=t=>t.status!=='done'&&t.due&&t.due<today();

function setView(v){view=v;render()}
function render(){
  if(!unlocked)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#main').innerHTML={day:vDay,meeting:vMeeting,tasks:vTasks,stats:vStats,people:vPeople}[view]();
}

// ---------- задачи ----------
function taskRow(t,full){
  const ov=isOver(t), mt=t.meetingId&&S.meetings.find(x=>x.id===t.meetingId);
  return `<div class="task ${t.status==='done'?'done':''}">
    <input type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleTask('${t.id}')" title="Выполнено">
    <div class="t"><div class="title">${esc(t.title)}</div>
      <div class="small">${full?'':`<span class="tag">${esc(empName(t.assignee))}</span>`}${t.due?`<span class="tag ${ov?'over':''}">${ov?'просрочено · ':''}до ${ruDate(t.due)}</span>`:''}${!full&&t.status==='progress'?'<span class="tag">в работе</span>':''}${mt?`<span class="tag grey">${esc(mt.title)} ${ruDate(mt.date)}</span>`:''}</div>
      ${full?`<div class="row small" style="margin-top:6px">
        <select onchange="setTask('${t.id}','assignee',this.value)">${empOpts(t.assignee)}</select>
        <select onchange="setStatus('${t.id}',this.value)">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===t.status?'selected':''}>${v}</option>`).join('')}</select>
        <input type="date" value="${t.due||''}" onchange="setTask('${t.id}','due',this.value)">
      </div>`:''}
    </div>
    <button class="btn sm danger" onclick="delTask('${t.id}')" title="Удалить">✕</button>
  </div>`;
}
function addTask(o){const t=Object.assign({id:uid(),title:'',assignee:'',due:'',status:'new',created:today(),doneAt:null,meetingId:null},o);S.tasks.push(t);return t}
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);setStatus(id,t.status==='done'?'new':'done')}
function setStatus(id,st){const t=S.tasks.find(x=>x.id===id);t.status=st;t.doneAt=st==='done'?today():null;save();render()}
function setTask(id,k,v){S.tasks.find(x=>x.id===id)[k]=v;save();render()}
function delTask(id){if(!confirm('Удалить задачу?'))return;S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}

// ---------- ДЕНЬ ----------
function vDay(){
  const d=curDate, day=S.days[d]||{}, t0=today();
  const list=S.tasks.filter(t=>t.due===d||(!t.due&&t.created===d));
  const over=d===t0?S.tasks.filter(t=>isOver(t)):[];
  const meets=S.meetings.filter(x=>x.date===d);
  return `
  <div class="card row between">
    <div class="row"><button class="btn" onclick="shiftDay(-1)">←</button>
      <input type="date" value="${d}" onchange="curDate=this.value||today();render()">
      <button class="btn" onclick="shiftDay(1)">→</button>
      ${d!==t0?`<button class="btn" onclick="curDate=today();render()">Сегодня</button>`:''}</div>
    <b>${cap(longDate(d))}</b>
  </div>
  <div class="grid">
    <div>
      <div class="card"><h2>Задачи на день</h2>
        <div class="row" style="margin-bottom:8px"><input type="text" id="qt" class="grow" placeholder="Новая задача…" onkeydown="if(event.key==='Enter')quickAdd()">
          <select id="qa">${empOpts('')}</select><button class="btn primary" onclick="quickAdd()">Добавить</button></div>
        ${list.length?list.map(t=>taskRow(t)).join(''):'<p class="muted small">На этот день задач нет.</p>'}
      </div>
      ${over.length?`<div class="card"><h2 style="color:var(--bad)">Просрочено (${over.length})</h2>${over.map(t=>taskRow(t)).join('')}</div>`:''}
      ${meets.length?`<div class="card"><h2>Совещания</h2>${meets.map(x=>`<div class="task"><div class="t"><a href="#" onclick="openMeeting('${x.id}');return false">${esc(x.title)}</a> <span class="muted small">· поручений: ${S.tasks.filter(t=>t.meetingId===x.id).length}</span></div></div>`).join('')}</div>`:''}
    </div>
    <div>
      <div class="card"><h2>Записи дня</h2>
        <textarea placeholder="События, мысли, договорённости, звонки…" oninput="setDay('notes',this.value)">${esc(day.notes||'')}</textarea></div>
      <div class="card"><h2>Итоги дня</h2>
        <textarea style="min-height:90px" placeholder="Что сделано · что не получилось и почему · что переносится на завтра" oninput="setDay('summary',this.value)">${esc(day.summary||'')}</textarea>
        <div class="row" style="margin-top:8px"><span class="muted small">Оценка дня:</span>
          <span class="stars">${[1,2,3,4,5].map(i=>`<button class="${(day.rating||0)>=i?'on':''}" onclick="setDay('rating',${i});render()">★</button>`).join('')}</span></div>
      </div>
    </div>
  </div>`;
}
function shiftDay(n){curDate=addDays(curDate,n);render()}
function setDay(k,v){S.days[curDate]=Object.assign({},S.days[curDate],{[k]:v});save()}
function quickAdd(){const v=$('#qt').value.trim();if(!v)return;addTask({title:v,assignee:$('#qa').value,due:curDate});save();render();$('#qt').focus()}

// ---------- СОВЕЩАНИЕ: распознавание речи ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, recOn=false, speechMode='';
async function speechLocal(){
  // распознавание на самом устройстве (новые версии Chrome): голос не уходит в интернет
  if(!SR||!('processLocally' in SR.prototype)||typeof SR.available!=='function')return false;
  const o={langs:['ru-RU'],processLocally:true};
  try{
    let st=await SR.available(o);
    if((st==='downloadable'||st==='downloading')&&confirm('Можно скачать русский языковой пакет, чтобы речь распознавалась прямо на планшете, без отправки голоса в интернет. Скачать (один раз)?')){
      await SR.install(o);st=await SR.available(o);
    }
    return st==='available';
  }catch(e){return false}
}
async function startRec(){
  if(!SR){alert('Этот браузер не поддерживает распознавание речи. Откройте ежедневник в Google Chrome — либо вставьте текст расшифровки вручную.');return}
  const local=await speechLocal();
  if(!local&&!S.settings.cloudSpeech){
    if(!confirm('На этом устройстве распознавание речи без интернета недоступно.\n\nЕсли продолжить, браузер будет отправлять звук на серверы Google (за пределами РФ). Тогда не называйте вслух персональные данные: паспорта, адреса, телефоны, здоровье, зарплаты. Фамилии и поручения — на ваше усмотрение.\n\nРазрешить облачное распознавание?'))return;
    S.settings.cloudSpeech=true;save();
  }
  // на Android непрерывный режим дублирует фразы — слушаем по одной фразе и сразу перезапускаем
  rec=new SR();rec.lang='ru-RU';rec.continuous=!/Android/i.test(navigator.userAgent);rec.interimResults=true;
  if(local)rec.processLocally=true;
  speechMode=local?'🔒 на устройстве':'☁ через Google';
  rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)appendTr(r[0].transcript);else interim+=r[0].transcript}const el=$('#interim');if(el)el.textContent=interim};
  rec.onerror=e=>{
    if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){recOn=false;alert('Нет доступа к микрофону ('+e.error+'). Разрешите микрофон для этой страницы в настройках браузера.')}

// ---------- извлечение поручений ----------
const TRIG=/(поруч|подготов|сдела|провер|отправ|направ|согласов|организ|обеспеч|разработ|предостав|доложи|доклад|собрат|собер|выполн|устран|позвон|написа|напиш|закуп|оформ|подпис|состав|контрол|назнач|решит|реши|изучи|проработ|ответствен|срок|нужно|надо|необходимо|должен|должна|прошу|заменить|замени|отремонт|рассчита|посчита|найти|найди|договор|прислать|пришли|внести|внеси|запланир|провести|проведи|сверит|сверь|оплат|пройти|пройди|укомплект|обуч|получи|выда|подай|подать|обнов|исправ|забрать|забери|доставь|доставить)/i;
const STRONG=/(поруч|задач|ответствен|прошу)/i;
function stem(w){w=w.toLowerCase().replace(/[^a-zа-яё0-9-]/g,'');for(let i=0;i<2&&w.length>3&&/[аеёиоуыэюяйь]$/.test(w);i++)w=w.slice(0,-1);return w}
const END='[аеёиоуыэюяйьмхвг]{0,3}';
function keyRe(phrase){const ws=phrase.trim().split(/\s+/).map(stem).filter(Boolean);if(!ws.length)return null;return new RegExp('(^|[^a-zа-яё])('+ws.map(w=>escRe(w)+END).join('[\\s-]+')+')(?![a-zа-яё])','i')}
function empKeys(e){const k=[];const sur=(e.name||'').trim().split(/\s+/)[0];if(sur)k.push(sur);
  const pos=(e.position||'').trim().toLowerCase();if(pos&&S.employees.filter(x=>(x.position||'').trim().toLowerCase()===pos).length===1)k.push(e.position);
  (e.aliases||'').split(',').forEach(a=>{a=a.trim();if(a)k.push(a)});return k}
function findEmp(s){
  const low=s.toLowerCase();let best=null;
  for(const e of S.employees)for(const k of empKeys(e)){const re=keyRe(k);if(!re)continue;const m=re.exec(low);
    if(m){const pos=m.index+m[1].length,len=m[2].length;if(!best||pos<best.pos||(pos===best.pos&&len>best.len))best={id:e.id,pos,len}}}
  return best;
}
const WD=[['воскресен',0],['понедельник',1],['вторник',2],['сред',3],['четверг',4],['пятниц',5],['суббот',6]];
const MN=['январ','феврал','март','апрел','ма','июн','июл','август','сентябр','октябр','ноябр','декабр'];
const PRE='(?:срок\\s*[:—-]?\\s*)?(?:(?:до|к|ко|в|во|на|не позднее)\\s+)?';
function parseDue(s,base){
  const b=parseYmd(base);let m;
  const R=p=>new RegExp(PRE+p,'i');
  if(m=s.match(R('(\\d{1,2})[./](\\d{1,2})(?:[./](\\d{2,4}))?'))){let y=m[3]?+m[3]:b.getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);if(!m[3]&&d<b)d.setFullYear(y+1);return{date:ymd(d),text:m[0]}}
  if(m=s.match(R('(\\d{1,2})\\s+(январ|феврал|март|апрел|ма[яй]|июн|июл|август|сентябр|октябр|ноябр|декабр)[а-яё]*'))){const mi=MN.findIndex(k=>m[2].toLowerCase().startsWith(k));const d=new Date(b.getFullYear(),mi,+m[1]);if(d<b)d.setFullYear(d.getFullYear()+1);return{date:ymd(d),text:m[0]}}
  if(m=s.match(R('послезавтра')))return{date:addDays(base,2),text:m[0]};
  if(m=s.match(R('завтра(?:шнего дня)?')))return{date:addDays(base,1),text:m[0]};
  if(m=s.match(R('сегодня(?:шнего дня)?')))return{date:base,text:m[0]};
  if(m=s.match(/через\s+(\d+|два|две|три|пять)\s+(дн|день|недел)[а-яё]*/i)){const n={два:2,две:2,три:3,пять:5}[m[1].toLowerCase()]||+m[1];return{date:addDays(base,/недел/i.test(m[2])?n*7:n),text:m[0]}}
  if(m=s.match(/через\s+неделю/i))return{date:addDays(base,7),text:m[0]};
  if(m=s.match(R('(?:конц[ау]|конец)\\s+недели')))return{date:addDays(monday(base),4),text:m[0]};
  if(m=s.match(R('(?:конц[ау]|конец)\\s+месяца')))return{date:ymd(new Date(b.getFullYear(),b.getMonth()+1,0)),text:m[0]};
  if(m=s.match(R('(воскресен|понедельник|вторник|сред|четверг|пятниц|суббот)[а-яё]*'))){const w=WD.find(x=>m[1].toLowerCase().startsWith(x[0]))[1];let n=(w-b.getDay()+7)%7||7;return{date:addDays(base,n),text:m[0]}}
  return null;
}
function extract(text,base){
  const out=[];
  const parts=text.split(/\n+|(?<=[.!?;])\s+/).map(x=>x.replace(/^\[\d\d:\d\d\]\s*/,'').trim()).filter(x=>x.length>8);
  for(const s of parts){
    const e=findEmp(s), due=parseDue(s,base);
    if(!((e&&(TRIG.test(s)||due))||(STRONG.test(s)&&s.length>15)))continue;
    let title=s;
    if(due)title=title.replace(due.text,' ');
    if(e){const mm=findEmp(title);if(mm)title=title.slice(0,mm.pos)+' '+title.slice(mm.pos+mm.len)}
    title=title.replace(/(?<![а-яё])(поручить|поручаю|поручение|задача|ответственн(ый|ая|ые)|прошу|исполнитель)(?![а-яё])[:\s]*/gi,' ')
      .replace(/\s+([,.;!?])/g,'$1').replace(/\s{2,}/g,' ').replace(/^[\s,.;:—–-]+|[\s,.;:—–-]+$/g,'');
    out.push({on:true,title:cap(title),assignee:e?e.id:'',due:due?due.date:'',src:s});
  }
  return out;
}

function weekReport(){
  const ws=weekStart, we=addDays(ws,6), inW=s=>s&&s>=ws&&s<=we;
  const L=[`ОТЧЁТ ЗА НЕДЕЛЮ ${dmy(ws)} — ${dmy(we)}`,''];
  L.push(`Поставлено задач: ${S.tasks.filter(t=>inW(t.created)).length}`,`Выполнено: ${S.tasks.filter(t=>inW(t.doneAt)).length}`,`Совещаний: ${S.meetings.filter(m=>inW(m.date)).length}`,'');
  const ov=S.tasks.filter(t=>isOver(t)&&t.due<=we);
  if(ov.length){L.push('ПРОСРОЧЕНО:');groupBy(ov).forEach(([n,g])=>{L.push(`  ${n}:`);g.forEach(t=>L.push(`   – ${t.title} (срок ${dmy(t.due)})`))});L.push('')}
  const dn=S.tasks.filter(t=>inW(t.doneAt));
  if(dn.length){L.push('ВЫПОЛНЕНО:');groupBy(dn).forEach(([n,g])=>{L.push(`  ${n}:`);g.forEach(t=>L.push(`   – ${t.title}`))});L.push('')}
  const sm=[...Array(7)].map((_,i)=>addDays(ws,i)).filter(d=>S.days[d]?.summary);
  if(sm.length){L.push('ИТОГИ ДНЕЙ:');sm.forEach(d=>L.push(`  ${dmy(d)}: ${S.days[d].summary.replace(/\n/g,'; ')}`))}
  return L.join('\n');
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function b24(method,params){
  const p=new URLSearchParams();
  const add=(k,v)=>{if(Array.isArray(v))v.forEach((x,i)=>add(`${k}[${i}]`,x));else if(v&&typeof v==='object')Object.entries(v).forEach(([kk,vv])=>add(`${k}[${kk}]`,vv));else p.append(k,v)};
  Object.entries(params||{}).forEach(([k,v])=>add(k,v));
  let r;
  try{r=await fetch(S.settings.b24+method+'.json',{method:'POST',body:p})}catch(e){throw new Error('нет связи с Битрикс24 — проверьте интернет и адрес вебхука')}
  const j=await r.json().catch(()=>({error:'HTTP '+r.status}));
  if(j.error)throw new Error(j.error_description||j.error);
  await sleep(550); // Битрикс24 принимает не больше 2 запросов в секунду
  return j;
}

// Пока ПИН включён, все данные (записи, задачи, сотрудники, адрес вебхука) хранятся зашифрованными AES-256.
// Ключ получается из ПИН (PBKDF2) и живёт только в памяти, пока ежедневник открыт.
const PIN_KEY='diary.pin', LOCK_MIN=5, PIN_LEN=6, PBKDF2_ITER=310000;
let unlocked=false, cryptoKey=null, pinMode=null, pinBuf='', pinFirst='', pinFails=0, pinWaitUntil=0, idleTimer=null, waitTimer=null, pinBusy=false;
function pinRec(){try{return JSON.parse(localStorage.getItem(PIN_KEY)||'null')}catch(e){return null}}
const canCrypt=()=>!!(window.crypto&&crypto.subtle);
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pin,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:iter||PBKDF2_ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encWith(key,text){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));return JSON.stringify({enc:1,iv:b64(iv),ct:b64(ct)})}
async function decWith(key,env){const e=typeof env==='string'?JSON.parse(env):env;return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.iv)},key,unb64(e.ct)))}
function showLock(mode){
  if((mode==='set1')&&!canCrypt())return alert('Шифрование недоступно: откройте ежедневник по https-ссылке (GitHub Pages) в Google Chrome.');
  pinMode=mode;pinBuf='';
  if(mode==='unlock'){unlocked=false;cryptoKey=null;S=EMPTY();snapMap=null;$('#main').innerHTML=''}
  if(!$('#lock')){const el=document.createElement('div');el.id='lock';document.body.appendChild(el)}
  drawLock();
}
function drawLock(msg){
  const el=$('#lock');if(!el)return;
  const title={unlock:'Введите ПИН-код',set1:`Придумайте ПИН-код из ${PIN_LEN} цифр`,set2:'Повторите ПИН-код'}[pinMode];
  const wait=Math.ceil((pinWaitUntil-Date.now())/1000);
  el.innerHTML=`<div class="box"><div style="font-size:34px">🔒</div><b>${title}</b>
    <div class="dots">${[...Array(PIN_LEN)].map((_,i)=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div>
    <div class="small" style="min-height:1.4em;color:${pinBusy?'var(--muted)':'var(--bad)'}">${pinBusy?'Проверяю…':msg||(wait>0?`Слишком много попыток. Подождите ${wait} с`:'')}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join('')}
      ${pinMode==='unlock'?`<button class="small" onclick="pinForgot()">Забыли?</button>`:`<button class="small" onclick="pinCancel()">Отмена</button>`}
      <button onclick="pinKey('0')">0</button><button onclick="pinKey('del')" aria-label="Стереть">⌫</button></div></div>`;
}
function shake(){const b=$('#lock .box');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}
async function pinKey(k){
  if(pinBusy)return;
  if(pinMode==='unlock'&&Date.now()<pinWaitUntil)return drawLock();
  if(k==='del'){pinBuf=pinBuf.slice(0,-1);return drawLock()}
  if(pinBuf.length>=PIN_LEN)return;
  pinBuf+=k;drawLock();
  if(pinBuf.length<PIN_LEN)return;
  const pin=pinBuf;pinBuf='';
  if(pinMode==='unlock'){
    const r=pinRec();pinBusy=true;drawLock();
    let ok=false;
    try{const key=await deriveKey(pin,r.salt,r.iter);await decWith(key,r.check);cryptoKey=key;ok=true;
      const raw=localStorage.getItem(KEY);S=Object.assign(EMPTY(),raw?JSON.parse(raw.includes('"enc":1')?await decWith(key,raw):raw):{});
      if(raw&&!raw.includes('"enc":1'))save(); // данные остались открытыми — шифруем
    }catch(e){if(ok){alert('Не удалось прочитать данные: '+e.message)}}
    pinBusy=false;
    if(ok){pinFails=0;return unlock()}
    if(++pinFails>=5){pinFails=0;pinWaitUntil=Date.now()+30000;clearInterval(waitTimer);waitTimer=setInterval(()=>{drawLock();if(Date.now()>=pinWaitUntil)clearInterval(waitTimer)},1000)}
    drawLock(pinFails?`Неверный ПИН. Осталось попыток: ${5-pinFails}`:'');shake();
  }else if(pinMode==='set1'){pinFirst=pin;pinMode='set2';drawLock()}
  else{
    if(pin!==pinFirst){pinMode='set1';drawLock('ПИН-коды не совпали, попробуйте ещё раз');return shake()}
    pinBusy=true;drawLock();
    try{
      const salt=b64(crypto.getRandomValues(new Uint8Array(16))), key=await deriveKey(pin,salt,PBKDF2_ITER);
      const check=await encWith(key,'diary-ok');
      cryptoKey=key;localStorage.setItem(PIN_KEY,JSON.stringify({v:2,salt,iter:PBKDF2_ITER,check}));
      save();await saving;
    }catch(e){alert('Не удалось включить шифрование: '+e.message)}
    pinBusy=false;unlock();
  }
}
function unlock(){unlocked=true;pinMode=null;if(!snapMap)stamp();const el=$('#lock');if(el)el.remove();render();resetIdle()}
function pinCancel(){unlock()}
async function pinOff(){
  if(!confirm('Отключить ПИН-код? Данные будут храниться на устройстве без шифрования.'))return;
  await saving;localStorage.removeItem(PIN_KEY);cryptoKey=null;save();render();
}
function pinForgot(){
  if(!confirm('Забытый ПИН-код восстановить нельзя — данные зашифрованы.\n\nМожно удалить ВСЕ данные ежедневника и начать заново, а потом вернуть записи из резервной копии, если она есть (для зашифрованной копии понадобится ПИН, с которым она сделана).\n\nУдалить все данные?'))return;
  if(!confirm('Точно удалить все записи, задачи, совещания и сотрудников с этого устройства?'))return;
  localStorage.removeItem(KEY);localStorage.removeItem(PIN_KEY);cryptoKey=null;S=EMPTY();snapMap=null;unlock();
}
async function lockNow(){if(pinRec()&&unlocked){await saving;showLock('unlock')}}
function resetIdle(){clearTimeout(idleTimer);if(pinRec())idleTimer=setTimeout(()=>{if(recOn)resetIdle();else lockNow()},LOCK_MIN*60000)}
// закрывать при сворачивании приложения или выключении экрана
document.addEventListener('visibilitychange',()=>{if(document.hidden)lockNow()});
['pointerdown','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(unlocked)resetIdle()},{passive:true}));
document.addEventListener('keydown',e=>{if(!$('#lock'))return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('del')});

if(pinRec())showLock('unlock');else unlock();
// установка как приложение и работа без интернета (только при открытии по https)
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
// просим браузер не удалять данные при нехватке памяти
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
